<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Confirm order — Just Your Memories</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@700&family=Manrope:wght@400;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#FBF2E2; --paper:#FFFDF8; --ink:#241A12; --ink-soft:#5C4E40;
    --magenta:#EF4F80; --magenta-dark:#C93764; --teal:#257C79; --line:rgba(36,26,18,0.12);
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--cream);color:var(--ink);font-family:'Manrope',sans-serif;}
  .wrap{max-width:520px;margin:0 auto;padding:48px 24px;}
  .card{background:var(--paper);border:1px solid var(--line);border-radius:22px;padding:36px 32px;text-align:center;}
  h1{font-family:'Fraunces',serif;font-size:28px;margin:0 0 10px;}
  p{color:var(--ink-soft);line-height:1.55;margin:0 0 12px;font-size:15px;}
  .order-num{
    display:inline-block;margin:18px 0 8px;padding:10px 18px;border-radius:999px;
    background:var(--cream);font-family:'Space Mono',monospace;font-weight:700;
  }
  .icon{
    width:64px;height:64px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    margin:0 auto 18px;background:var(--teal);color:#fff;
  }
  .icon.error{background:var(--magenta);}
  .field{text-align:left;margin-top:20px;}
  .field label{
    display:block;font-size:12px;font-weight:700;color:var(--ink-soft);
    margin-bottom:6px;text-transform:uppercase;letter-spacing:0.04em;
  }
  .field input{
    width:100%;padding:12px 14px;border-radius:10px;border:1px solid var(--line);
    font-family:'Space Mono',monospace;font-size:15px;background:#fff;
  }
  .field input:focus{outline:2px solid var(--magenta);outline-offset:1px;}
  .field-error{color:var(--magenta-dark);font-size:13px;font-weight:600;margin-top:8px;display:none;}
  .field-error.show{display:block;}
  .btn{
    display:inline-flex;align-items:center;justify-content:center;margin-top:22px;
    padding:12px 22px;border-radius:999px;background:var(--magenta);color:#fff;
    text-decoration:none;font-weight:700;font-size:14px;border:none;cursor:pointer;font-family:inherit;
  }
  .btn:hover{background:var(--magenta-dark);}
  .btn:disabled{opacity:0.6;cursor:not-allowed;}
  .brand{display:block;text-align:center;margin-bottom:28px;font-family:'Fraunces',serif;font-size:22px;font-weight:700;color:var(--ink);text-decoration:none;}
  .hidden{display:none !important;}
</style>
</head>
<body>
<main class="wrap">
  <a href="index.html" class="brand">Just Your Memories</a>
  <div class="card" id="panel">
    <div class="icon" id="icon">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6l9 7 9-7"/><rect x="3" y="5" width="18" height="14" rx="2"/></svg>
    </div>
    <h1 id="title">Confirm your order</h1>
    <p id="message">Enter the order number from your confirmation email to finish.</p>

    <form id="confirmForm">
      <div class="field">
        <label for="orderNumberInput">Order number</label>
        <input type="text" id="orderNumberInput" name="orderNumber" placeholder="JYM-482913" autocomplete="off" required>
        <div class="field-error" id="formError"></div>
      </div>
      <button type="submit" class="btn" id="submitBtn">Confirm order</button>
    </form>

    <div class="order-num hidden" id="orderNum"></div>
    <a href="index.html" class="btn hidden" id="homeBtn">Back to home</a>
  </div>
</main>
<script src="api-utils.js"></script>
<script>
(function(){
  const params = new URLSearchParams(location.search);
  const token = params.get('token');
  const form = document.getElementById('confirmForm');
  const title = document.getElementById('title');
  const message = document.getElementById('message');
  const orderNum = document.getElementById('orderNum');
  const homeBtn = document.getElementById('homeBtn');
  const icon = document.getElementById('icon');
  const formError = document.getElementById('formError');
  const submitBtn = document.getElementById('submitBtn');

  function showSuccess(orderNumber, already){
    form.classList.add('hidden');
    icon.innerHTML = '<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>';
    title.textContent = already ? 'Already confirmed' : 'Order confirmed!';
    message.textContent = already
      ? 'This order was already confirmed. We are getting started on your memories.'
      : 'Thank you! Your order is confirmed and we will start printing soon.';
    orderNum.classList.remove('hidden');
    orderNum.textContent = orderNumber;
    homeBtn.classList.remove('hidden');
  }

  function showFatalError(text){
    form.classList.add('hidden');
    icon.classList.add('error');
    icon.innerHTML = '<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18M6 6l12 12"/></svg>';
    title.textContent = 'Could not confirm';
    message.textContent = text;
    homeBtn.classList.remove('hidden');
  }

  if(!token){
    showFatalError('This confirmation link is missing or invalid.');
    return;
  }

  form.addEventListener('submit', async e=>{
    e.preventDefault();
    formError.classList.remove('show');
    const orderNumber = document.getElementById('orderNumberInput').value.trim().toUpperCase();
    submitBtn.disabled = true;
    submitBtn.textContent = 'Confirming…';

    try {
      const { res, data } = await fetchJson('/api/orders/confirm', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token, orderNumber })
      });
      if(!res.ok) throw new Error(data.error || 'Confirmation failed.');
      showSuccess(data.orderNumber, data.alreadyConfirmed);
    } catch (err) {
      formError.textContent = err.message;
      formError.classList.add('show');
      submitBtn.disabled = false;
      submitBtn.textContent = 'Confirm order';
    }
  });
})();
</script>
</body>
</html>
